# ============================================================================
# GLIMPSE — default / recommended config (LoDoPaB-CT, 128x128, 30 sparse views)
# ============================================================================
# This matches the published `glimpse.pt` checkpoint. It uses the ODL forward
# operator (GPU), which is the recommended setup. Requires environment-odl.yml.
#
#   python train.py    --config configs/lodopab.yaml
#   python evaluate.py --config configs/lodopab.yaml --checkpoint glimpse.pt
#
# Any field can be overridden on the command line, e.g. `--n-angles 60`.

# ---- Acquisition geometry (must match the dataset) -------------------------
image_size: 128            # reconstructed image side length, in pixels
n_angles: 50               # number of projection angles (views)
noise_snr: 45              # measurement noise, signal-to-noise ratio in dB
geometry: 'odl'            # forward operator: 'odl' (GPU, recommended) | 'skimage' (CPU)
circle: false              # ODL only: false = image whole square | true = inscribed circle

# ---- Sensor (mis)calibration -----------------------------------------------
# How the angles the model is *told* diverge from the *true* angles:
#   'No' (calibrated) | 'random' (jittered) | 'fixed' (offset) | 'blind' (unknown)
uncalibrated_type: 'No'

# ---- Model -----------------------------------------------------------------
patch_size: 9              # side length of the local 'glimpse' patch
head_type: 'MLP'           # prediction head: 'MLP' | 'multi_MLP'
filter_name: 'ramp'        # FBP filter init: 'ramp'|'shepp-logan'|'cosine'|'hamming'|'hann'
learnable_filter: True     # let training adapt the Fourier (FBP) filter
learn_geometry: False      # learn the sensor geometry (angles + per-angle offsets)
patch_shape: 'round'       # local sampling pattern: 'round'|'square'|'random'
learn_patch: true          # learn the local sampling-patch point pattern

# ---- Training --------------------------------------------------------------
epochs: 3000               # number of training epochs
batch_size: 64             # images per mini-batch
lr: 0.0001                 # Adam learning rate
pixels_per_step: 512       # random pixels optimised per gradient step (GLIMPSE is per-pixel)
steps_per_batch: 3         # gradient steps taken on each image mini-batch
train: true                # if false, only evaluate (no training)
restore_model: true        # reload the checkpoint (if present) before training

# ---- Data (RAW image folders; sinograms rendered on the fly) ---------------
train_path: 'datasets/train'
test_path: 'datasets/test'
ood_path: 'datasets/ood'   # out-of-distribution set (brain images) for generalization

# ---- Experiment / evaluation -----------------------------------------------
exp_desc: 'lodopab'        # suffix for the experiment dir: experiments/<size>_<angles>_<desc>
gpu: 0                     # CUDA device index
ood_analysis: true         # also evaluate on the OOD set
sample_number: 4           # number of samples in the saved visualisations
cmap: 'gray'               # matplotlib colormap for output PNGs
