# Minimal, cross-platform conda environment for GLIMPSE.
#
#   conda env create -f environment.yml
#   conda activate glimpse
#   pip install -e .            # optional: install the `glimpse` package
#
# For a GPU build, conda resolves the appropriate CUDA-enabled PyTorch from the
# pytorch / nvidia channels automatically on Linux/Windows.
name: glimpse
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9
  - pytorch>=1.12
  - torchvision>=0.13
  - numpy>=1.21
  - scipy>=1.7
  - scikit-image>=0.19
  - matplotlib>=3.5
  - imageio>=2.19
  - tqdm>=4.62
  - pyyaml>=6.0
  - huggingface_hub>=0.24
  - safetensors>=0.4
  - jupyter
